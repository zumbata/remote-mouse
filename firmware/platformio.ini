; PhoneTrackpad dongle firmware.
;
; Two builds, pick the one that matches your board and how you want the PC to see it:
;   pio run -e ble-mouse -t upload   any ESP32 / ESP32-C3 / ESP32-S3: the PC pairs with it as a Bluetooth mouse
;   pio run -e usb-mouse -t upload   ESP32-S3 / ESP32-S2 only: plug it into the PC, it shows up as a USB mouse
;
; The iPhone always talks to the dongle over Bluetooth LE.

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
lib_deps = h2zero/NimBLE-Arduino@^2.5.2

[env:ble-mouse]
board = esp32dev
build_flags = -DTRACKPAD_OUTPUT_USB=0

[env:usb-mouse]
board = esp32-s3-devkitc-1
; ESP32-S3-Zero: 4 MB flash (the devkitc board file assumes 8 MB).
board_upload.flash_size = 4MB
board_build.partitions = default.csv
; The board file sets USB mode 1 (USB-Serial/JTAG); drop it so mode 0 (TinyUSB) is the only definition.
build_unflags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
build_flags =
    -DTRACKPAD_OUTPUT_USB=1
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=0
    ; The USB library compiles all its sources, including USB host mass storage (USBMSCFS.h),
    ; which includes FS.h; LDF does not give the USB library FS's include path, so pass it globally.
    -I${platformio.packages_dir}/framework-arduinoespressif32/libraries/FS/src
lib_deps =
    ${env.lib_deps}
    FS
